<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
  <title id="title">HDS Interlude / 幕间系统</title>
  <desc id="desc">纸面上的持续叙事：右侧几何方块沿径向渐隐，如幕间生活的留白。聊天在幕前发生，生活在幕间继续。</desc>
  <defs>
    <pattern id="cubes" width="110" height="110" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="90" height="90" fill="#9db0c9"/>
    </pattern>
    <radialGradient id="fade" gradientUnits="userSpaceOnUse" cx="1152" cy="-22" r="1060">
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="fadeMask">
      <rect x="660" y="-180" width="980" height="920" fill="url(#fade)"/>
    </mask>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1440" height="560" fill="#f7f8fa"/>
  <rect x="0.5" y="0.5" width="1439" height="559" fill="none" stroke="#e5e7eb"/>
  <g font-family="Outfit, Segoe UI, Arial, sans-serif">
    <rect x="64" y="44" width="12" height="12" fill="#2563eb"/>
    <text x="88" y="56" font-size="15" font-weight="600" letter-spacing="2" fill="#475569">HDS / CONTINUOUS NARRATIVE</text>
    <text x="1376" y="56" text-anchor="end" font-size="13" font-weight="600" letter-spacing="2" fill="#6b7280">AN OPEN-SOURCE INTERLUDE</text>
    <path d="M64 78H1376" fill="none" stroke="#d9dfe7"/>
    <text x="62" y="198" font-size="78" font-weight="700" letter-spacing="-3" fill="#111827">HDS</text>
    <text x="57" y="304" font-size="112" font-weight="700" letter-spacing="-5" fill="#111827">Interlude</text>
    <circle cx="536" cy="296" r="10" fill="#ff5c33"/>
    <text x="66" y="360" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" letter-spacing="7" fill="#475569">幕间系统</text>
    <text x="66" y="407" font-size="17" font-weight="500" letter-spacing="2.5" fill="#6b7280">A LIFE BETWEEN MESSAGES.</text>
    <path d="M64 447H776" fill="none" stroke="#d9dfe7"/>
    <text x="64" y="483" font-size="12" letter-spacing="1" fill="#2563eb">01</text>
    <text x="96" y="483" font-size="13" font-weight="600" letter-spacing="2" fill="#111827">STORY</text>
    <text x="64" y="516" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6b7280">一段共同的剧本</text>
    <path d="M296 469V520" stroke="#d9dfe7"/>
    <text x="328" y="483" font-size="12" letter-spacing="1" fill="#2563eb">02</text>
    <text x="360" y="483" font-size="13" font-weight="600" letter-spacing="2" fill="#111827">TIME</text>
    <text x="328" y="516" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6b7280">不断流动的时间</text>
    <path d="M544 469V520" stroke="#d9dfe7"/>
    <text x="576" y="483" font-size="12" letter-spacing="1" fill="#2563eb">03</text>
    <text x="608" y="483" font-size="13" font-weight="600" letter-spacing="2" fill="#111827">CONTINUITY</text>
    <text x="576" y="516" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="15" fill="#6b7280">持续生活的角色</text>
  </g>
  <!-- 一条龙几何语言：重复方块 + 径向渐隐（multiply 于纸面之上），一枚蓝色方块点题。 -->
  <g mask="url(#fadeMask)">
    <g opacity="0.32" style="mix-blend-mode:multiply">
      <rect x="660" y="-180" width="980" height="920" fill="url(#cubes)"/>
    </g>
    <rect x="990" y="220" width="90" height="90" fill="#2563eb" opacity="0.9"/>
    <rect x="1210" y="440" width="90" height="90" fill="#ff5c33" opacity="0.75"/>
  </g>
  <circle cx="1345" cy="485" r="170" fill="#9db0c9" opacity="0.16" filter="url(#soft)"/>
  <g font-family="Outfit, Segoe UI, Arial, sans-serif" font-size="12" letter-spacing="2" fill="#6b7280">
    <text x="912" y="474">ON STAGE / BETWEEN SCENES</text>
    <text x="912" y="516">KOISHI</text>
    <path d="M1000 512H1310" stroke="#d9dfe7"/>
    <text x="1376" y="516" text-anchor="end" fill="#2563eb">HDSI</text>
  </g>
</svg>
